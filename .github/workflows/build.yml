name: Build LogLog

on:
  push:
    branches: [ main ]
    tags:     [ 'v*.*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. JDK 17 ────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 3. Setup Gradle ───────────────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # ── 4. Generate gradlew (repo tidak menyertakan gradlew) ─────────────────
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13

      # ── 5. Gradle wrapper permission ─────────────────────────────────────────
      - name: Grant execute permission
        run: chmod +x ./gradlew

      # ── 6. Gradle cache ──────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 7. Build Debug APK (setiap push ke main) ─────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loglog-debug
          path: app/build/outputs/apk/debug/loglog-v*-debug.apk
          if-no-files-found: warn

      # ── 8. Setup keystore + local.properties (hanya saat tag) ────────────────
      - name: Setup signing
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > loglog.jks
          cat > local.properties << EOF2
          STORE_FILE=loglog.jks
          STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF2

      # ── 9. Build Release APK (hanya saat push tag v*.*) ─────────────────────
      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── 10. Buat GitHub Release dan upload APK ───────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/loglog-v*-release.apk
            app/build/outputs/apk/debug/loglog-v*-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 11. Notif Telegram ───────────────────────────────────────────────────
      - name: Telegram Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          REF="${{ github.ref_name }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            MSG="Build *LogLog* berhasil!"
          else
            EMOJI="❌"
            MSG="Build *LogLog* gagal!"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="${EMOJI} ${MSG}
          Ref: \`${REF}\`
          [Lihat Detail](${RUN_URL})" || true
